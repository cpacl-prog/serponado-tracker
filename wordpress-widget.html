<!-- BLOCK 14 – SERPONADO LEADERBOARD WIDGET -->

<style>
  #serponado-wrap { max-width: 100%; }
  #serponado-wrap .lb-meta { font-size: 0.9rem; color: #888 !important; margin-bottom: 16px; }
  #serponado-wrap .lb-meta strong { color: var(--optimerch-green) !important; }
  #serponado-wrap table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  #serponado-wrap table thead tr { background: var(--optimerch-green) !important; }
  #serponado-wrap table thead th { color: #000 !important; padding: 10px; text-align: left; }
  #serponado-wrap table tbody td { color: #ccc !important; padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  #serponado-wrap table tbody tr:hover td { background: rgba(255,255,255,0.05) !important; }
  #serponado-wrap table tbody td:first-child { color: #fff !important; }
  #serponado-wrap table tbody td:nth-child(2) { color: var(--optimerch-green) !important; }
  #serponado-wrap .own td { background: rgba(42,183,88,0.08) !important; }
  #serponado-wrap .own td:first-child,
  #serponado-wrap .own td:nth-child(2) { font-weight: 800; }
  #serponado-wrap .sn-placeholder td { color: #444 !important; font-style: italic; }
  #serponado-wrap .sn-placeholder td:first-child { color: #555 !important; }
  #serponado-wrap .sn-placeholder td:nth-child(2) { color: #444 !important; }

  /* === OVERVIEW TABLE (alle Geräte + Meilensteine) === */
  .sn-overview-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 24px; border: 1px solid #222; border-radius: 12px; }
  .sn-overview-table { border-collapse: collapse; table-layout: auto; }
  .sn-overview-table th { background: rgba(255,255,255,0.03) !important; color: #666 !important; font-size: 0.72rem; padding: 10px 18px; text-align: center; font-weight: 700; border-bottom: 1px solid #222; }
  .sn-overview-table td { text-align: center; padding: 12px 18px; color: #ccc !important; border-bottom: 1px solid #1a1a1a; }
  .sn-overview-table tr:last-child td { border-bottom: none; }
  /* Aktive Spalte */
  .sn-overview-table th.active-col { background: rgba(42,183,88,0.12) !important; color: var(--optimerch-green) !important; }
  .sn-overview-table td.active-col { background: rgba(42,183,88,0.06) !important; }
  /* Trennlinie zwischen Positions- und Meilenstein-Block */
  .sn-overview-table tr.sn-sep-row td { border-bottom: 2px solid #222; padding: 0; height: 0; }
  /* Zeilenbeschriftung */
  .sn-row-label { font-size: 0.68rem; color: #555 !important; text-transform: uppercase; letter-spacing: 0.06em; text-align: left !important; white-space: nowrap; padding-right: 8px !important; background: transparent !important; border-right: 1px solid #222; }
  /* Positions-Zahl */
  .sn-pos-big { font-size: 1.9rem; font-weight: 900; color: var(--optimerch-green) !important; line-height: 1; display: block; }
  .sn-pos-stale { font-size: 0.65rem; color: #555 !important; display: block; margin-top: 2px; }
  /* Spalten-Überschrift (Gerät) */
  .sn-th-label { display: block; font-size: 0.8rem; font-weight: 700; color: inherit; }
  .sn-th-sub { display: block; font-size: 0.65rem; font-weight: 400; opacity: 0.7; margin-top: 2px; }
  /* Meilenstein-Datum */
  .sn-ms-date { font-size: 0.78rem; color: #aaa !important; }
  .sn-ms-none { font-size: 0.72rem; color: #444 !important; font-style: italic; }
  /* Meilenstein-Zeilentitel */
  .sn-ms-rowtitle { font-size: 0.85rem; }

  /* === CHART === */
  .sn-chart-wrap { background: var(--darker-bg); border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .sn-chart-wrap h3 { margin: 0 0 14px; font-size: 1rem; color: #fff !important; }
  .sn-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .sn-legend-item { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px; border-radius: 20px; border: 1px solid transparent; cursor: default; font-size: 0.75rem; color: #aaa !important; transition: color 0.15s, background 0.15s, border-color 0.15s; }
  .sn-legend-item:hover { color: #fff !important; }
  .sn-legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* === TOGGLE (innerhalb Chart-Bereich) === */
  .sn-toggle { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .sn-toggle button { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 7px 16px; color: #888; cursor: pointer; font-size: 0.82rem; transition: background 0.2s, color 0.2s, border-color 0.2s; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .sn-toggle button.active { background: var(--optimerch-green); color: #000; font-weight: 700; border-color: var(--optimerch-green); }
  .sn-toggle button.active .sn-toggle-sub { color: rgba(0,0,0,0.55); }
  .sn-toggle button:hover:not(.active) { background: rgba(255,255,255,0.07); color: #ccc; border-color: rgba(255,255,255,0.2); }
  .sn-toggle-sub { font-size: 0.63rem; font-weight: 400; color: #555; letter-spacing: 0.03em; }

  #serponado-status { color: #888 !important; font-size: 0.95rem; }
</style>

<section class="section-padding container">
    <div class="serponado-explainer">
        <div class="overline">SERPONADO · AKTUELLE SUCHERGEBNISSE BEI GOOGLE</div>
        <h2 class="section-title" id="leaderboard">Serponado <span>Suchergebnisse – Google Top 10</span></h2>
        <div id="serponado-wrap">
            <div id="sn-content">
                <p id="serponado-status">Lade Rankings...</p>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script>
(function() {
  const GITHUB_USER   = 'cpacl-prog';
  const GITHUB_REPO   = 'serponado-tracker';
  const EIGENE_DOMAIN = 'optimerch.de';
  const MAX_ROWS      = 10;
  const REFRESH_MS    = 30 * 60 * 1000;
  const FAVICON_URL   = 'https://www.optimerch.de/wp-content/uploads/2021/04/optimerch-favicon-kreis.webp';
  const OWN_COLOR     = '#2ab758';
  const ATTR_ID       = 'sn-attribution';
  const ATTR_HREF     = 'https://www.optimerch.de/serponado/';
  const PALETTE       = [
    '#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c',
    '#e67e22','#2980b9','#c0392b','#8e44ad','#16a085',
    '#d35400','#f1c40f','#e91e63','#ff5722','#607d8b',
    '#00bcd4','#ff9800','#795548','#009688','#673ab7'
  ];

  const TOGGLE_DEFS = [
    { id: 'sn-toggle-mobile',     device: 'mobile',      label: '📱 Mobile',                   sub: '412 × 915 px' },
    { id: 'sn-toggle-desktop',    device: 'desktop',     label: '🖥️ Desktop',                 sub: '1920 × 1080 px' },
    { id: 'sn-toggle-mobile-lg',  device: 'mobile-lg',   label: '📱 Mobile · Desktop-Screen',  sub: '1920 × 1080 px' },
    { id: 'sn-toggle-desktop-sm', device: 'desktop-sm',  label: '🖥️ Desktop · Mobile-Screen',  sub: '412 × 915 px' },
  ];

  const JSON_FILES = {
    'mobile':      'rankings.json',
    'desktop':     'rankings-desktop.json',
    'mobile-lg':   'rankings-mobile-desktopsize.json',
    'desktop-sm':  'rankings-desktop-mobilesize.json',
  };

  let currentDevice = 'mobile';
  let activeCharts  = {};

  const faviconImg = new Image(14, 14);
  faviconImg.src = FAVICON_URL;

  const glowPlugin = {
    id: 'ownLineGlow',
    beforeDatasetDraw(chart, args) {
      const ds = chart.data.datasets[args.index];
      if (!ds.label.includes(EIGENE_DOMAIN)) return;
      const ctx = chart.ctx; ctx.save();
      ctx.shadowColor = OWN_COLOR; ctx.shadowBlur = 28;
    },
    afterDatasetDraw(chart, args) {
      const ds = chart.data.datasets[args.index];
      if (!ds.label.includes(EIGENE_DOMAIN)) return;
      chart.ctx.restore();
    }
  };
  Chart.register(glowPlugin);

  let colorMap = {};

  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function buildColorMap(entries) {
    colorMap = {}; let idx = 0;
    entries.forEach(h => {
      if (!h.positions) return;
      Object.keys(h.positions).forEach(d => {
        if (!(d in colorMap))
          colorMap[d] = d.includes(EIGENE_DOMAIN) ? OWN_COLOR : PALETTE[idx++ % PALETTE.length];
      });
    });
  }

  function attributionValid() {
    const el = document.getElementById(ATTR_ID);
    if (!el) return false;
    const a = el.querySelector('a');
    if (!a) return false;
    const rel = (a.getAttribute('rel') || '').toLowerCase();
    return a.href.includes('optimerch.de/serponado') && !rel.includes('nofollow');
  }

  function destroyCharts() {
    Object.values(activeCharts).forEach(c => c.destroy());
    activeCharts = {};
  }

  function getOwnPos(data) {
    if (!data) return null;
    const entry = (data.rankings || []).find(r => r.domain && r.domain.includes(EIGENE_DOMAIN));
    if (entry) return { position: entry.position, stale: false };
    const own = data.own_url || {};
    return { position: own.position || null, stale: own.stale || false };
  }

  /* ── Overview-Tabelle: alle Geräte + alle Meilensteine aller Geräte ── */
  function renderOverview(allData) {
    const medal   = p => p === 1 ? '🥇' : p === 2 ? '🥈' : '🥉';
    const fmtDate = s => new Date(s + 'T00:00:00').toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' });

    /* Spalten-Header */
    const thCols = TOGGLE_DEFS.map(d => {
      const active = d.device === currentDevice ? ' active-col' : '';
      return `<th class="${active}" style="white-space:nowrap"><span class="sn-th-label">${d.label}</span><span class="sn-th-sub">${d.sub}</span></th>`;
    }).join('');

    /* Positions-Zeile */
    const posCols = TOGGLE_DEFS.map(d => {
      const active = d.device === currentDevice ? ' active-col' : '';
      const info   = getOwnPos(allData[d.device]);
      const posStr = info && info.position ? `#${info.position}` : '–';
      const stale  = info && info.stale ? '<span class="sn-pos-stale">zuletzt gesehen</span>' : '';
      return `<td class="${active}" style="white-space:nowrap"><span class="sn-pos-big">${posStr}</span>${stale}</td>`;
    }).join('');

    /* Meilensteine: alle Geräte gleichzeitig – pro Medal-Position eine Zeile */
    const posDates = {};
    const allMedalPos = new Set();
    TOGGLE_DEFS.forEach(({ device }) => {
      posDates[device] = {};
      const moments = (allData[device] || {}).top3_moments || [];
      moments.forEach(m => {
        if (!posDates[device][m.position]) posDates[device][m.position] = [];
        posDates[device][m.position].push(m.date);
        allMedalPos.add(m.position);
      });
    });

    const msRows = Array.from(allMedalPos).sort((a, b) => a - b).map(pos => {
      const cols = TOGGLE_DEFS.map(({ device }) => {
        const active = device === currentDevice ? ' active-col' : '';
        const dates  = (posDates[device] || {})[pos] || [];
        if (!dates.length) return `<td class="${active}" style="white-space:nowrap"><span class="sn-ms-none">–</span></td>`;
        return `<td class="${active}" style="white-space:nowrap">${dates.map(d => `<span class="sn-ms-date">${fmtDate(d)}</span>`).join('<br>')}</td>`;
      }).join('');
      return `<tr>
        <td class="sn-row-label" style="white-space:nowrap">${medal(pos)} Platz #${pos}</td>
        ${cols}
      </tr>`;
    }).join('');

    const hasMilestones = allMedalPos.size > 0;

    return `
      <div class="sn-overview-scroll">
        <table class="sn-overview-table">
          <thead>
            <tr>
              <th style="text-align:left;border-right:1px solid #222;white-space:nowrap"></th>
              ${thCols}
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="sn-row-label" style="white-space:nowrap">Platzierung</td>
              ${posCols}
            </tr>
            ${hasMilestones ? `<tr class="sn-sep-row"><td colspan="${TOGGLE_DEFS.length + 1}"></td></tr>${msRows}` : ''}
          </tbody>
        </table>
      </div>`;
  }

  /* ── Toggle-Buttons ── */
  function renderToggle() {
    return `<div class="sn-toggle">${TOGGLE_DEFS.map(d => `
      <button id="${d.id}" class="${currentDevice === d.device ? 'active' : ''}">${d.label}<span class="sn-toggle-sub">${d.sub}</span></button>`
    ).join('')}</div>`;
  }

  function attachToggleListeners() {
    TOGGLE_DEFS.forEach(({ id: btnId, device }) => {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.addEventListener('click', function() {
        if (currentDevice === device) return;
        currentDevice = device;
        load();
      });
    });
  }

  /* ── Laden ── */
  function load() {
    const existing = document.getElementById(ATTR_ID);
    if (existing && !attributionValid()) {
      document.getElementById('sn-content').innerHTML =
        `<p style="color:#888;font-size:0.9rem">Dieses Widget erfordert einen Dofollow-Link auf
         <a href="${ATTR_HREF}" style="color:var(--optimerch-green)">${ATTR_HREF}</a> –
         bitte die Nutzungsbedingungen einhalten.</p>`;
      return;
    }
    const base = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/public/`;
    const t    = Date.now();
    Promise.all(
      TOGGLE_DEFS.map(({ device }) =>
        fetch(`${base}${JSON_FILES[device]}?t=${t}`)
          .then(r => r.json())
          .then(d => ({ device, d }))
          .catch(() => ({ device, d: null }))
      )
    ).then(results => {
      const allData = {};
      results.forEach(({ device, d }) => { allData[device] = d; });
      const primary = allData[currentDevice];
      if (!primary) {
        const s = document.getElementById('serponado-status');
        if (s) s.textContent = 'Rankings konnten nicht geladen werden.';
        return;
      }
      render(primary, allData);
    });
  }

  /* ── Chart-Helfer ── */
  function buildDatasets(entries) {
    const domainSet = new Set();
    entries.forEach(h => { if (h.positions) Object.keys(h.positions).forEach(d => domainSet.add(d)); });
    return Array.from(domainSet).map(domain => {
      const isOwn = domain.includes(EIGENE_DOMAIN);
      const color = colorMap[domain] || '#888';
      return {
        label: domain, data: entries.map(h => h.positions ? (h.positions[domain] || null) : null),
        borderColor: color, backgroundColor: isOwn ? hexToRgba(color, 0.08) : 'transparent',
        borderWidth: isOwn ? 2.5 : 1.5, pointStyle: isOwn ? faviconImg : 'circle',
        pointRadius: isOwn ? 8 : 2, pointHoverRadius: isOwn ? 10 : 5,
        tension: 0.3, fill: isOwn, spanGaps: true, order: isOwn ? 0 : 1,
      };
    });
  }

  function chartOptions() {
    return {
      responsive: true,
      interaction: { mode: 'index', axis: 'x', intersect: false },
      scales: {
        y: { reverse: true, min: 1, max: MAX_ROWS, title: { display: true, text: 'Platz', color: '#888' }, ticks: { stepSize: 5, color: '#888' }, grid: { color: 'rgba(255,255,255,0.05)' } },
        x: { ticks: { maxTicksLimit: 12, maxRotation: 45, color: '#888' }, grid: { color: 'rgba(255,255,255,0.05)' } }
      },
      plugins: {
        legend: { display: false },
        tooltip: { filter: item => item.dataset.label.includes(EIGENE_DOMAIN), callbacks: { label: ctx => `${ctx.dataset.label}: Platz ${ctx.parsed.y ?? 'nicht in Top 10'}` } }
      }
    };
  }

  function attachLegend(chart, legendEl) {
    const datasets = chart.data.datasets;
    legendEl.innerHTML = '';
    datasets.forEach((ds, i) => {
      const color = colorMap[ds.label] || '#888';
      const item  = document.createElement('span');
      item.className = 'sn-legend-item';
      item.style.borderColor = hexToRgba(color, 0.3);
      item.innerHTML = `<span class="sn-legend-dot" style="background:${color}"></span>${ds.label}`;
      item.addEventListener('mouseenter', () => {
        datasets.forEach((d, j) => {
          const c = colorMap[d.label] || '#888';
          d.borderColor = j === i ? c : hexToRgba(c, 0.1);
          d.borderWidth = j === i ? (d.label.includes(EIGENE_DOMAIN) ? 3.5 : 2.5) : 0.5;
        });
        item.style.background = hexToRgba(color, 0.15); item.style.borderColor = color;
        chart.update('none');
      });
      item.addEventListener('mouseleave', () => {
        datasets.forEach(d => { d.borderColor = colorMap[d.label] || '#888'; d.borderWidth = d.label.includes(EIGENE_DOMAIN) ? 2.5 : 1.5; });
        item.style.background = ''; item.style.borderColor = hexToRgba(color, 0.3);
        chart.update('none');
      });
      legendEl.appendChild(item);
    });
  }

  function renderChart(canvasId, legendId, entries, labelFn) {
    if (entries.length < 2) {
      document.getElementById(canvasId).parentElement.innerHTML += '<p style="font-size:0.85rem;color:#666">Noch zu wenig Daten.</p>';
      return;
    }
    activeCharts[canvasId] = new Chart(document.getElementById(canvasId), {
      type: 'line', data: { labels: entries.map(labelFn), datasets: buildDatasets(entries) }, options: chartOptions()
    });
    attachLegend(activeCharts[canvasId], document.getElementById(legendId));
  }

  /* ── Haupt-Render ── */
  function render(data, allData) {
    const content = document.getElementById('sn-content');
    destroyCharts();

    if (!data.rankings || data.rankings.length === 0) {
      content.innerHTML = '<p style="color:#888">Noch keine Rankings vorhanden.</p>';
      return;
    }

    const valid  = (data.history || []).filter(h => h.positions);
    const hourly = valid.slice(-48);
    buildColorMap(valid);

    const posMap = {};
    (data.rankings || []).forEach(r => { if (r.position) posMap[r.position] = r; });

    const rows = [];
    for (let pos = 1; pos <= MAX_ROWS; pos++) {
      const r = posMap[pos];
      if (r) {
        const isOwn = r.domain && r.domain.includes(EIGENE_DOMAIN);
        const medal = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : '';
        const title = (r.title || r.url).replace(/</g, '&lt;');
        rows.push(`<tr class="${isOwn ? 'own' : ''}">
          <td>${medal} #${pos}</td>
          <td>${r.domain}${isOwn ? ' ⭐' : ''}</td>
          <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${title}</td>
        </tr>`);
      } else {
        rows.push(`<tr class="sn-placeholder">
          <td>#${pos}</td>
          <td colspan="2">— Anzeige / Nicht-organisches Ergebnis</td>
        </tr>`);
      }
    }

    const activeLabel = TOGGLE_DEFS.find(d => d.device === currentDevice);
    const metaLabel   = activeLabel ? `${activeLabel.label} · ${activeLabel.sub}` : '';

    content.innerHTML = `
      ${renderOverview(allData)}

      <p class="lb-meta">🔍 Keyword: <strong>${data.keyword}</strong> &nbsp;|&nbsp; ${metaLabel} &nbsp;|&nbsp; Stand: ${data.updated_at}</p>

      <div class="sn-chart-wrap">
        <h3>⏱ Verlauf im 30-Minuten-Takt (letzte 24 Stunden)</h3>
        ${renderToggle()}
        <canvas id="sn-chart-hourly" height="110"></canvas>
        <div class="sn-legend" id="sn-legend-hourly"></div>
      </div>

      <table>
        <thead><tr><th>Platz</th><th>Domain (Top 10)</th><th>Seite</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>

      <p id="${ATTR_ID}" style="font-size:0.72rem;color:#555;margin-top:14px;text-align:right">
        Tracking powered by <a href="${ATTR_HREF}" rel="noopener" style="color:#666">Serponado-Tracker @ optimerch.de</a>
      </p>`;

    attachToggleListeners();
    renderChart('sn-chart-hourly', 'sn-legend-hourly', hourly, h => h.ts.replace(' (Berlin)','').split(' ')[1]);
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
